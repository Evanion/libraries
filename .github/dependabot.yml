version: 2

updates:
  # Actions are pinned to commit SHAs (the repo requires it), which means the
  # tag no longer floats and security fixes do not arrive on their own.
  # Dependabot reads the `# vX.Y.Z` comment next to each SHA to know what
  # version is in use, and opens a PR that moves both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A published library's peerDependencies range is the floor its consumers
    # must meet. Dependabot's npm default raises every range to the new
    # version, so each patch release of a peer would become a new floor. This
    # strategy leaves a range alone when it already admits the new version,
    # and the lockfile still moves to it.
    versioning-strategy: increase-if-necessary
    # A monorepo with three published libraries produces a lot of update noise
    # if every package moves on its own PR. Group the routine ones; security
    # updates are unaffected by grouping and still come through individually.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    labels:
      - dependencies
    open-pull-requests-limit: 10
    ignore:
      # Nx packages move as a set and are upgraded with `nx migrate`, which
      # also runs the codemods. Dependabot bumping one of them in isolation
      # produces a broken workspace.
      - dependency-name: '@nx/*'
      - dependency-name: 'nx'
      # TypeScript 7 breaks `npm ci` with ERESOLVE: @astrojs/check@0.9.10
      # (the latest published version) declares peerDependencies of
      # `^5.0.0 || ^6.0.0`, so it rejects TypeScript 7 outright. `versions`
      # is scoped to the 7.x line only, so 8.x and later are still proposed
      # normally. Remove once @astrojs/check publishes a release whose
      # peerDependencies allow TypeScript 7 (see dependabot PR #40).
      - dependency-name: 'typescript'
        versions: ['^7.0.0']
      # eslint 10 breaks `npm ci` with ERESOLVE: eslint-plugin-import@2.32.0
      # (the latest published version) declares peerDependencies of
      # `^2 || ^3 || ^4 || ^5 || ^6 || ^7.2.0 || ^8 || ^9`, so it rejects
      # eslint 10 outright. `versions` is scoped to the 10.x line only, so
      # 11.x and later are still proposed normally. Remove once
      # eslint-plugin-import publishes a release whose peerDependencies
      # allow eslint 10 (see dependabot PR #43).
      - dependency-name: 'eslint'
        versions: ['^10.0.0']
      # Shiki 4 runs outside Nextra's range: nextra@4.6.1 (the latest
      # published version) depends on `shiki ^3.2.1` and
      # `@shikijs/twoslash ^3.2.1`, and pins rehype-pretty-code 0.14.1, whose
      # peer is `shiki ^1 || ^2 || ^3`. Moving ours installs a second shiki,
      # so the site's fences and code-classes.mjs highlight with different
      # majors. `versions` is scoped to the 4.x line. Remove once a nextra
      # release depends on shiki 4 (see dependabot PR #386).
      - dependency-name: 'shiki'
        versions: ['^4.0.0']
      - dependency-name: '@shikijs/*'
        versions: ['^4.0.0']
