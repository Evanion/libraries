name: Re-cut docs

# Re-cuts one released version of a package's documentation from a later commit
# on main, as a commit to main that changes one entry of apps/docs/archives.json.
# docs/specs/2026-09-13-released-by-default.md § 7 is the design: the dispatch
# is the control, and the run summary carries the diff of the section between
# the commit the version was cut from and the one it is cut from now.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "The package's section, as in apps/docs/app/navigation.ts: luhn, urn"
        type: string
        required: true
      segment:
        description: 'The release line: v3 at or above 1.0.0, v0.2 below it'
        type: string
        required: true
      sha:
        description: 'The commit on main to cut from. Empty for the head of main.'
        type: string
        default: ''
      reason:
        description: 'Why the released pages change. Written into the pin and the commit.'
        type: string
        required: true

# The push authenticates as the release deploy key, not as GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: docs-recut
  cancel-in-progress: false

jobs:
  recut:
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags: the guards ask whether the commit
      # descends from the release's tag and is on main, and the dry run reads
      # the commits since the tag.
      #
      # Checked out over SSH with the release deploy key, the one credential
      # that can push past the main ruleset. release.yml's checkout says why,
      # and what else the key cannot do.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Inputs reach the script as environment variables. A `${{ }}`
      # interpolation is substituted into the script text before the shell sees
      # it, so an input containing shell syntax would run as part of this step.
      #
      # recut.mjs refuses a line that was never released, a commit that does not
      # descend from its tag or is not on main, a reason another pin gives, and
      # a commit `nx release version --dry-run` versions as another release. It
      # writes the pin and the pull request body, and nothing else.
      - name: Re-cut
        id: recut
        env:
          SLUG: ${{ inputs.slug }}
          SEGMENT: ${{ inputs.segment }}
          SHA: ${{ inputs.sha }}
          REASON: ${{ inputs.reason }}
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          target=$(git rev-parse --verify "${SHA:-HEAD}^{commit}")
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/docs/tools/recut.mjs \
            --slug "$SLUG" --segment "$SEGMENT" --sha "$target" --reason "$REASON" \
            --body "$RUNNER_TEMP/body.md"
          echo "short=${target:0:7}" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      # The commit runs the repository's hooks like any other: the pre-commit
      # hook lints the affected projects through nx, and commitlint holds a body
      # line to 100 characters. A reason is one line of any length, so the body
      # is the reason folded at spaces, with the dispatcher named under it.
      #
      # main can move while the job runs. The pin is one entry of one file, so
      # the commit is replayed onto the new main and pushed again.
      - name: Commit the pin to main
        env:
          SLUG: ${{ inputs.slug }}
          SEGMENT: ${{ inputs.segment }}
          REASON: ${{ inputs.reason }}
          SHORT: ${{ steps.recut.outputs.short }}
          ACTOR: ${{ github.actor }}
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          title="docs(docs): re-cut the $SLUG $SEGMENT documentation from $SHORT"
          git commit -m "$title" \
            -m "$(printf '%s\n' "$REASON" | fold -s -w 100)" \
            -m "Dispatched by @$ACTOR." \
            -- apps/docs/archives.json
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
