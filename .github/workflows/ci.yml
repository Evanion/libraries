name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # An invalid workflow file does not fail a job, because no job runs. GitHub
  # records a run with no jobs and the message "This run likely failed because
  # of a workflow file issue", and a workflow that only triggers manually shows
  # that against every push. actionlint reads the files as GitHub's schema
  # does, so the error surfaces in a job that can actually go red.
  #
  # Separate from `main` so it reports on its own, and first because it takes
  # seconds.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0

      # Pinned by version and checksum rather than installed through a
      # third-party action: the binary is the whole dependency, and verifying it
      # is two lines.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" actionlint
          ./actionlint -color

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # `check` is listed alongside `typecheck`, not instead of it. Nx infers a
      # typecheck target from tsconfig.json but disables it -- replacing the
      # command with an echo -- whenever the resolved config sets `noEmit: true`,
      # because `tsc --build` cannot run that way. Astro's shared config sets
      # exactly that, so storefront's typecheck target is a no-op, and `astro
      # build` does not typecheck either, unlike `next build`. `astro check` is
      # the only thing that typechecks the .astro files.
      - run: npx nx run-many -t lint test build typecheck check

      # Reports the run's task results to Nx Cloud. `always()` because the run it
      # reports on is the failing one.
      - run: npx nx fix-ci
        if: always()
