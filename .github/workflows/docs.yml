name: Docs

# The docs site is a static export deployed to GitHub Pages at docs.evanion.com.
on:
  push:
    branches: [main]
    paths:
      # The site documents the libraries, so their source counts as an input.
      - 'apps/docs/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish the Pages deployment
  id-token: write # Pages deployments are OIDC-authenticated

# Let a running deploy finish rather than cancelling it half-published, but
# collapse queued ones so only the newest commit gets deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # `output: 'export'` writes a fully static site to apps/docs/out.
      - name: Build
        run: npx nx build docs

      # Pagefind indexes the exported HTML and writes its index alongside it.
      # This runs as a separate step because nx invokes `next build` directly
      # rather than `npm run build`, so npm's postbuild lifecycle never fires.
      - name: Build search index
        working-directory: apps/docs
        run: npm run postbuild

      # Guard the two files that silently break the site if they go missing:
      # without .nojekyll, Pages runs Jekyll and drops the entire _next/
      # directory because it starts with an underscore; without CNAME, the
      # custom domain reverts.
      - name: Check deploy artefacts
        working-directory: apps/docs/out
        run: |
          for f in .nojekyll CNAME index.html _pagefind/pagefind.js; do
            [ -e "$f" ] || { echo "missing from export: $f" >&2; exit 1; }
          done
          [ "$(cat CNAME)" = "docs.evanion.com" ] || { echo "unexpected CNAME: $(cat CNAME)" >&2; exit 1; }
          echo "export looks deployable ($(find . -type f | wc -l | tr -d ' ') files)"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
