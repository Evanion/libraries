name: Release

# Manual trigger rather than publish-on-push. Releasing is the one thing in this
# repo that cannot be undone -- npm versions are immutable and tags are public --
# so it stays a deliberate act.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute versions and changelogs without publishing anything'
        type: boolean
        default: true
      first-release:
        description: 'First release from this repo (no git tags exist yet)'
        type: boolean
        default: false

permissions:
  contents: write # create tags and GitHub releases
  id-token: write # mint the OIDC token npm exchanges for publish rights

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx release reads the full history to infer versions from
          # conventional commits, and needs the tags to know where to start.
          fetch-depth: 0
          filter: tree:0
          # Check out over SSH with a write deploy key rather than the default
          # GITHUB_TOKEN.
          #
          # `nx release` pushes the version-bump commit and the tags straight to
          # main (it is forced on by changelog.projectChangelogs.createRelease:
          # "github" -- see nx's release.js, shouldPush). The main ruleset
          # requires a reviewed pull request, and github-actions[bot] cannot be
          # granted a bypass on a personal repository: the API rejects an
          # Integration bypass actor outside an organisation. A deploy key can
          # bypass, so the push authenticates as one.
          #
          # This key is git-write, this repo only. It cannot publish to npm --
          # that stays credential-free OIDC below -- and it cannot change repo
          # settings. Revoking it is deleting the deploy key.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # Deliberately no dependency cache. npm's guidance is that release
          # builds should not restore one, so what gets published is built from
          # exactly what the lockfile resolves to.

      # Trusted publishing needs npm >= 11.5.1. Below that the CLI does not
      # attempt the OIDC exchange at all and fails with an opaque auth error, so
      # check explicitly rather than letting a runner image change break a
      # release in a way that is hard to read.
      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing (need >= $required)" >&2
            exit 1
          fi
          echo "npm $actual supports trusted publishing"

      - run: npm ci

      # Never publish an unverified tree.
      - name: Verify
        # Same target list as CI, including `check`. astro-widget-demo's
        # inferred typecheck target is a disabled no-op (Astro's config sets
        # noEmit), so `astro check` is what actually typechecks it. The release
        # gate must not be weaker than the pull request gate.
        run: npx nx run-many -t lint test build typecheck check

      # Catches problems that only exist once the package is packed -- notably
      # emitted .d.ts files that a nodenext consumer cannot resolve. Everything
      # inside the workspace resolves from source, so nothing above sees these.
      - name: Verify packaging
        run: npm run verify:packaging

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog and tag
        # Inputs go through env rather than being interpolated into the script.
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          FIRST_RELEASE: ${{ inputs.first-release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          [ "$FIRST_RELEASE" = "true" ] && args+=(--first-release)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); else args+=(--yes); fi
          echo "Running: nx release ${args[*]}"
          npx nx release "${args[@]}"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        env:
          FIRST_RELEASE: ${{ inputs.first-release }}
          # No NODE_AUTH_TOKEN and no NPM_TOKEN, deliberately.
          #
          # The npm CLI detects the GitHub Actions OIDC environment and exchanges
          # the id-token granted above for short-lived publish rights, scoped to
          # this repository and this workflow filename. There is no long-lived
          # credential in this repo for anyone to steal, which is the whole point:
          # npm is retiring bypass-2FA tokens (restricted since 2026-07-31, direct
          # publish targeted for removal in January 2027), and a token that
          # *requires* 2FA cannot work unattended by definition.
          #
          # Renaming this file breaks publishing until the trusted publisher
          # config on npmjs.com is updated -- npm matches it by filename.
          #
          # Provenance is automatic under trusted publishing, so neither
          # NPM_CONFIG_PROVENANCE nor --provenance is needed.
        run: |
          args=()
          [ "$FIRST_RELEASE" = "true" ] && args+=(--first-release)
          npx nx release publish "${args[@]}"
