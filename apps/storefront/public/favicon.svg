<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The ink ground with a chalk disc on it: a counter on baize.

    The two values repeat the palette's `ink` and `chalk` because an SVG served
    as a file cannot read a CSS custom property from the page that links it.
  -->
  <rect width="32" height="32" rx="6" fill="#0C1714" />
  <circle cx="16" cy="16" r="7" fill="#F2EDE3" />
</svg>
